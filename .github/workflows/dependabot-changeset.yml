name: Dependabot Changeset

on: pull_request_target

permissions:
  contents: write

jobs:
  changeset:
    runs-on: ubuntu-latest
    # Keyed on the PR author, not the triggering actor: a push to a Dependabot
    # branch by anyone else must not change whether this job runs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # pull_request_target runs with write permissions; this checkout is safe
      # because we only create a new file — no PR code is executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dependabot/fetch-metadata@v3
        id: metadata

      # npm production deps only. github-actions updates also report
      # `direct:production`, but they don't change the published package, so a
      # changeset for them is meaningless — and the commit below would push the
      # PR head past its CI run (GITHUB_TOKEN pushes never trigger workflows),
      # leaving the required `check` missing and the PR blocked forever.
      - name: Create changeset for production dependency updates
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.dependency-type == 'direct:production'
        run: |
          cat > ".changeset/dependabot-$(date +%s).md" << 'EOF'
          ---
          "nestjs-busboy": patch
          ---

          Update dependency ${{ steps.metadata.outputs.dependency-names }} to ${{ steps.metadata.outputs.new-version }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset
          git commit -m "chore: add changeset for dependency update"
          git push
