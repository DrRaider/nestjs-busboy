name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Keyed on the PR author, not the triggering actor: a push to a Dependabot
    # branch by anyone else must not change whether this job runs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: metadata

      # `main` requires an approving review, so human PRs get reviewed. Dependabot
      # PRs are approved here instead, which is what exempts them from that rule.
      # Requires "Allow GitHub Actions to create and approve pull requests".
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review "$PR_URL" --approve
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --auto queues the merge behind branch protection instead of demanding it
      # right now, while `check` is still running. Requires "Allow auto-merge".
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
